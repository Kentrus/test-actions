name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kentrus/test-actions:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="SSH_HOST "
          [ -z "$SSH_USER" ] && missing="${missing}SSH_USER "
          [ -z "$SSH_KEY" ] && missing="${missing}SSH_PRIVATE_KEY "
          [ -z "$GHCR_TOKEN" ] && missing="${missing}GHCR_TOKEN "
          if [ -n "$missing" ]; then
            echo "ERROR: These secrets are empty or not set: $missing"
            echo "Check: Settings -> Secrets and variables -> Actions"
            echo "Names must be exactly: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, GHCR_TOKEN"
            exit 1
          fi
          echo "All 4 secrets are set (values are hidden)."

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/kentrus/test-actions:latest
            docker stop test-actions 2>/dev/null || true
            docker rm test-actions 2>/dev/null || true
            docker run -d --name test-actions --restart unless-stopped -p 8000:8000 ghcr.io/kentrus/test-actions:latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
